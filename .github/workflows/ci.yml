name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Start test database
        run: echo "DATABASE_URL=$(PGBIN=/usr/lib/postgresql/16/bin ./scripts/test-db.sh)" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
